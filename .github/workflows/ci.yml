name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Contracts that compile and pass their tests. The other workspace members
  # do not compile yet (see .github/workflows/README.md); add each one here
  # in the PR that fixes it.
  CRATES: >-
    -p Contracts
    -p credential-issuer-registry
    -p doctor-registry
    -p drug-batch-registry
    -p hai-tracking
    -p health-savings-pool
    -p treatment-crowdfund
    -p micro-insurance-pool
    -p training-certification
    -p healthcare-credentialing
    -p hospital-discharge-management
    -p insurer-registry
    -p iwosan-marketplace
    -p medical-device-tracking
    -p multisig-governance
    -p nft-badges
    -p nutrition-care-management
    -p patient-vitals
    -p rehabilitation-services
    -p scholarship-fund
    -p ttl-config
    -p zk-eligibility
    -p zk-eligibility-verifier
  # Crates checked with cargo fmt (currently the same list).
  FMT_CRATES: >-
    -p Contracts
    -p credential-issuer-registry
    -p doctor-registry
    -p drug-batch-registry
    -p hai-tracking
    -p health-savings-pool
    -p treatment-crowdfund
    -p micro-insurance-pool
    -p training-certification
    -p healthcare-credentialing
    -p hospital-discharge-management
    -p insurer-registry
    -p iwosan-marketplace
    -p medical-device-tracking
    -p multisig-governance
    -p nft-badges
    -p nutrition-care-management
    -p patient-vitals
    -p rehabilitation-services
    -p scholarship-fund
    -p ttl-config
    -p zk-eligibility
    -p zk-eligibility-verifier
  # Crates held to clippy with warnings as errors.
  CLIPPY_CRATES: >-
    -p credential-issuer-registry
    -p drug-batch-registry
    -p health-savings-pool
    -p treatment-crowdfund
    -p micro-insurance-pool
    -p training-certification
    -p iwosan-marketplace

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt $FMT_CRATES -- --check

  build-test:
    name: Clippy · test · WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy $CLIPPY_CRATES --all-targets -- -D warnings
      - name: Test
        run: cargo test $CRATES
      - name: Build WASM
        run: cargo build $CRATES --target wasm32-unknown-unknown --release
