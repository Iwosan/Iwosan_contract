[package]
name = "iwosan-marketplace"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
credential-issuer-registry = { path = "../credential-issuer-registry" }
soroban-sdk = { workspace = true, features = ["testutils"] }
